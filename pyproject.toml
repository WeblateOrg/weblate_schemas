[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=78.0.2"
]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  {include-group = "types"}
]
lint = [
  {include-group = "pre-commit"}
]
pre-commit = [
  "prek==0.5.0"
]
test = [
  "pytest-cov==7.1.0",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest==9.1.1",
  "fedora-messaging>=3.9.1",
  "jsonschema[format]"
]
types = [
  "ty==0.0.78"
]

[project]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Localization",
  "Topic :: Utilities"
]
dependencies = [
  "jsonschema[format]>=4.24.0"
]
description = "A collection of JSON schemas used by Weblate"
keywords = [
  "i18n",
  "l10n",
  "gettext",
  "weblate",
  "translate"
]
license = "MIT"
license-files = ["LICENSE"]
name = "weblate_schemas"
requires-python = ">=3.10"
version = "2026.8"

[[project.authors]]
email = "michal@weblate.org"
name = "Michal Čihař"

[project.entry-points."fedora.messages"]
"weblate.message.v1" = "weblate_schemas.messages:WeblateV1Message"

[project.readme]
content-type = "text/x-rst"
file = "README.rst"

[project.urls]
Documentation = "https://docs.weblate.org/"
Download = "https://github.com/WeblateOrg/weblate_schemas"
Funding = "https://weblate.org/donate/"
Homepage = "https://weblate.org/"
"Issue Tracker" = "https://github.com/WeblateOrg/weblate_schemas/issues"
"Source Code" = "https://github.com/WeblateOrg/weblate_schemas"
Twitter = "https://twitter.com/WeblateOrg"

[tool.check-manifest]
ignore = [
  "LICENSES/*",
  "json/*",
  ".reuse/dep5",
  "scripts/*",
  "*.toml",
  "*.yml",
  "*.yaml",
  "*.json",
  ".editorconfig",
  ".weblate"
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-safe-fixes = [
  "ANN",
  "D",
  "future-required-type-annotation",
  "FLY",
  "SIM",
  "TCH",
  "UP"
]
ignore = [
  "COM", # CONFIG: No trailing commas
  "missing-copyright-notice",
  "incorrect-blank-line-before-class", # CONFIG: incompatible with D211
  "docstring-tab-indentation", # CONFIG: formatter
  "line-too-long", # CONFIG: using formatter
  "multi-line-summary-first-line", # CONFIG: incompatible with D213
  "DOC" # TODO: Ignore all pydoclint rules for now
]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ruff.lint.per-file-ignores]
"weblate_schemas/tests/**.py" = ["assert"]

[tool.rumdl]
disable = [
  # We do not enforce heading
  "first-line-heading",
  # Avoid length limit checks
  "line-length"
]

[tool.rumdl.per-file-ignores]
"README.md" = [
  # Allow HTML
  "MD033"
]

[tool.setuptools]
include-package-data = true
platforms = [
  "any"
]
zip-safe = false

[tool.setuptools.packages.find]
namespaces = true

[tool.ty.src]
include = ["weblate_schemas"]
